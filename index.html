<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b0d'/%3E%3Cg stroke='%23c8952f' stroke-width='2' fill='none'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Cpath d='M16 2v7M16 23v7M2 16h7M23 16h7'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Claude of Duty</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family:
          'Rajdhani', 'Barlow Condensed', 'Roboto Condensed', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #viewport {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: none;
        touch-action: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(ellipse at 50% 40%, #14171c 0%, #06070a 65%, #000 100%);
        transition: opacity 0.8s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: clamp(28px, 6vw, 64px);
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #e8e6e1;
        text-shadow: 0 0 42px rgba(255, 190, 90, 0.16);
      }
      #boot h1 span {
        color: #c8952f;
      }
      #boot-track {
        width: min(420px, 60vw);
        height: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      #boot-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #7a5a1e, #e0b358);
        transition: width 0.25s ease;
        box-shadow: 0 0 14px rgba(224, 179, 88, 0.7);
      }
      #boot-label {
        font-size: 11px;
        letter-spacing: 0.4em;
        color: rgba(232, 230, 225, 0.42);
        min-height: 14px;
      }
      noscript {
        color: #ddd;
        padding: 2rem;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="ui-root"></div>
    <div id="boot">
      <h1>Claude of <span>Duty</span></h1>
      <div id="boot-track"><div id="boot-bar"></div></div>
      <div id="boot-label">INITIALISING</div>
    </div>
    <noscript>This game requires JavaScript and WebGL 2.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
